<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit User</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn {
            padding: 10px 20px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn:hover {
            opacity: 0.8;
        }
        .btn-cancel {
            background-color: #f44336;
            margin-left: 10px;
        }
    </style>
</head>
<body>
<h1>Edit User</h1>

<form th:action="@{/users/update/{id}(id=${user.id})}"
      th:object="${user}"
      method="post">

    <input type="hidden" th:field="*{id}">

    <div class="form-group">
        <label>Name:</label>
        <input type="text" th:field="*{name}" required>
    </div>

    <div class="form-group">
        <label>Email:</label>
        <input type="email" th:field="*{email}" required>
    </div>

    <div class="form-group">
        <label>Age:</label>
        <input type="number" th:field="*{age}" required>
    </div>

    <button type="submit" class="btn">Update</button>
    <a href="/users" class="btn btn-cancel">Cancel</a>
</form>
</body>
</html>
